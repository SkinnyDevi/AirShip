name: iOS Tests (Swift)

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ios-test:
    name: Swift Package & iOS Build
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: src/ios/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('src/ios/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Swift package
        working-directory: src/ios
        run: swift build

      - name: Run Swift package tests
        working-directory: src/ios
        run: swift test

      - name: Build iOS App target (Simulator)
        working-directory: src/ios
        run: |
          xcodebuild build \
            -project AirShip.xcodeproj \
            -scheme AirShip \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
